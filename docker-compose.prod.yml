# Produccion:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Orden: postgres (sano) -> migrate (corre y termina) -> api
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # sin "ports": la base solo es visible dentro de la red de compose
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-28800}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      UPLOADS_DIR: /data/uploads
      # Verificación en dos pasos (ANEXO-S0 3.3). La llave va con la frase de los respaldos (D42), nunca en git.
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-}
      TWO_FACTOR_REQUIRED_ROLES: ${TWO_FACTOR_REQUIRED_ROLES:-}
      TWO_FACTOR_ISSUER: ${TWO_FACTOR_ISSUER:-Finanzas}
      # Línea de los comandos de operación (rescate del 2FA, exportación al cancelar); carpeta de operación montada aparte
      OPS_LOG_FILE: ${OPS_LOG_FILE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # solo local: el proxy (nginx/Caddy/Cloudflare Tunnel) es quien da la cara a internet
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads

volumes:
  pg_data:
  uploads:
