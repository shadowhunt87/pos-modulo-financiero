server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/markdown;

  server_tokens off;
  include /etc/nginx/snippets/security-headers.conf;

  # API: el prefijo /api se quita y se pasa al backend (servicio "api" de docker-compose, puerto 3000).
  # El login nunca necesita más de unos cientos de bytes: se corta antes de llegar al API.
  location = /api/auth/login {
    proxy_pass http://api:3000/auth/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 8k;
    # El API ya manda sus cabeceras con helmet (también las ven quienes lo llaman directo, sin nginx).
    # Estas cuatro las pone también nginx: se ocultan las del API para que cada una salga UNA vez,
    # con el valor de nginx (más estricto: DENY y frame-ancestors 'none'). El resto de helmet pasa igual.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
  }

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;   # adjuntos y extractos bancarios
    # El API ya manda sus cabeceras con helmet (también las ven quienes lo llaman directo, sin nginx).
    # Estas cuatro las pone también nginx: se ocultan las del API para que cada una salga UNA vez,
    # con el valor de nginx (más estricto: DENY y frame-ancestors 'none'). El resto de helmet pasa igual.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_read_timeout 120s;
  }

  # La configuración en runtime nunca se cachea (cambia sin recompilar).
  location = /config.json { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store"; }
  location = /index.html  { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; }

  # Manual de ayuda (ayuda.json, .md e imagenes): se revalida siempre (ETag) para que los cambios del
  # documentador se vean al instante. "^~" gana sobre la regex de estaticos de abajo (png/svg con immutable).
  location ^~ /manual/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    include /etc/nginx/mime.types;   # nginx 1.27 no trae el tipo de .md; se agrega solo aqui
    types { text/markdown md; }
    try_files $uri =404;
  }

  # Archivos con hash en el nombre: caché largo.
  location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier ruta del cliente vuelve a index.html
  location / { try_files $uri $uri/ /index.html; }
}
