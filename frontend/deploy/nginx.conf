server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # API: el prefijo /api se quita y se pasa al backend (servicio "api" de docker-compose, puerto 3000).
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;   # adjuntos y extractos bancarios
    proxy_read_timeout 120s;
  }

  # La configuración en runtime nunca se cachea (cambia sin recompilar).
  location = /config.json { add_header Cache-Control "no-store"; }
  location = /index.html  { add_header Cache-Control "no-cache"; }

  # Archivos con hash en el nombre: caché largo.
  location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier ruta del cliente vuelve a index.html
  location / { try_files $uri $uri/ /index.html; }
}
