# Cabeceras de seguridad de la SPA. Se incluyen en el server Y en cada location con
# add_header propio: en nginx, un add_header dentro de location anula los del server.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# El hash permite SOLO el script en línea que Angular (beasties) agrega para cargar el CSS.
# Si cambia la versión de Angular y la página sale sin estilos, recalcular el hash.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-LMY6wYoFV9I4wWzxaq1N/dTpl4iurQktw706UCHK3vM='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
