services:
  postgres:
    image: postgres:18-alpine
    container_name: financial-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: financial_pass
      POSTGRES_DB: financial_db
    ports:
      # 127.0.0.1: solo accesible desde tu máquina. Sin esto Docker publica el
      # puerto en todas las interfaces (y se salta el firewall/ufw).
      - "127.0.0.1:5432:5432"
    volumes:
      - financial_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_user -d financial_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Base SOLO para tests e2e (los tests borran datos): puerto 5434, sin volumen (datos en RAM)
  postgres-test:
    image: postgres:18-alpine
    container_name: financial-db-test
    environment:
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: financial_pass
      POSTGRES_DB: financial_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_user -d financial_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: financial-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sirtech.do
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

volumes:
  financial_pg_data:
